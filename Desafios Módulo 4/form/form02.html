<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#" method="post" autocomplete="on">
        <p>
            <label for="iusu">Usuário: </label>
            <input type="text" name="usu" id="iusu" maxlength="30" size="28" placeholder="Digite seu user" autocomplete="username">
        </p>
        <p>
            <label for="isen">Senha: </label>
            <input type="password" name="sen" id="isen" required minlength="8" maxlength="20" size="28" placeholder="Digite sua senha [0-8] digitos" autocomplete="current-password">
        </p>
        <p><input type="button" value="Enviar">
        <input type="reset" value="Limpar"></p>
    </form>
</body>
</html>
