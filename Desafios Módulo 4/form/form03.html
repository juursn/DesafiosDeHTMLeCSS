<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>Números</legend>
        <p>
            <label for="inu">Nota:</label>
            <input type="number" id="inu" min="0" max="10" placeholder="0 a 10" step="0.1" value="" required>
        </p>
        <p>
            <label for="imes">Periodo: </label>
            <input type="month" id="imes" value="" required>
        </p>
        <p>
            <label for="ida">Data: </label>
            <input type="date" id="ida">
        </p>
        <p>
            <label for="itm">Hora: </label>
            <input type="time" id="itm">
        </p>
        <p>
            <label for="ite">Telefone: </label>
            <input type="tel" id="ite" placeholder="(xx) xxxxx-xxxx">
        </p>
    </fieldset>
    <p>
        <input type="button" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
</body>
</html>
