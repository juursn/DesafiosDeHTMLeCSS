<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Formulário com Select</h1>
    <form action="#" method="post>
        <p>
            <label for="est">Estado: </label>
            <select name="Estado" id="est">
                <optgroup label="Região Sudeste">
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="SP">São Paulo</option>
                </optgroup>
                <optgroup label="Região Nordeste">
                    <option value="MA">Maranhão</option>
                    <option value="PE">Pernambuco</option>
                    <option value="RN">Rio Grande do Norte</option>
                </optgroup>
                
            </select>
        </p>
        <p>
            <label for="opt">Profissão: </label>
            <input type="text" id="opt" list="lstprof">
            <datalist id="lstprof">
                <option value="ADM">Adiministração</option>
                <option value="CONT">Contabilidade</option>
                <option value="DEV">Desenvolvedor</option>
            </datalist>

        </p>

        <p> 
            <label for="msg">Mensagem: </label>
            <textarea  id="msg" cols="30" rows="10"></textarea>
        </p>
        <p>
            <input type="button" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
