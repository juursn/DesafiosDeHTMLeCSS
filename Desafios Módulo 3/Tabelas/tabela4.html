<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="style.css" />
		<title>Tabela</title>
        <style>
            .color{
                background-color: rgba(62, 123, 156, 1);
                color: white;
            }
        </style>
	</head>
	<body>
		<table>
			<tr class="color">
				<th rowspan="2" scope="col">Área</th>
				<th rowspan="2" scope="col">Disciplinas</th>

				<th rowspan="2" scope="col">Média</th>
			</tr>
			<tr class="color">
				<th>Nota 1</th>
				<th>Nota 2</th>
			</tr>
			<tr>
				<th rowspan="4">Exatas</th>
				<td>Matemática</td>
				<td>0.0</td>
				<td>0.0</td>
				<td>0.0</td>
			</tr>
			<tr>
				<td>Física</td>
				<td>0.0</td>
				<td>0.0</td>
				<td>0.0</td>
			</tr>
			<tr>
				<td>Química</td>
				<td>0.0</td>
				<td>0.0</td>
				<td>0.0</td>
			</tr>
			<tr>
				<td>Biologia</td>
				<td>0.0</td>
				<td>0.0</td>
				<td>0.0</td>
			</tr>
			<tr class="color">
				<th colspan="4">Média de Exatas</th>
				<th>0.0</th>
			</tr>
			<tr>
				<th rowspan="2">Humanas</th>
				<td>História</td>
				<td>0.0</td>
				<td>0.0</td>
				<td>0.0</td>
			</tr>
			<tr>
				<td>Geografia</td>
				<td>0.0</td>
				<td>0.0</td>
				<td>0.0</td>
			</tr>
			<tr class="color">
                <th colspan="4">Média Humanas</th>
                <th>0.0</th>
            </tr>
		</table>
	</body>
</html>
